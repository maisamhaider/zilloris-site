<!doctype html>
<!--
  One app page: About, Privacy or Terms. build.ps1 fills the {{...}} slots.

  THE APPS PARSE THIS PAGE. One Page and Manuscript download the published
  policy and set it in their own type, so this structure is a contract, not
  just a layout:

    <main>            the document region - the apps read inside it
    <h1>              the document's title
    <h2>              a section; three or more, or the app refuses the page
    header, nav, footer   skipped by the parsers - keep chrome outside <main>

  Manuscript's documents also carry classes the parser reads: num, effective,
  intro, short, warning, legalese. Change any of this and both apps fall back
  to the older text built into them, with nothing to tell us it happened.
  Check with the app's parser after a structural change (manuscript's
  LegalHtmlTest, one-page's LegalHtmlTest), not by eye.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:title" content="{{PAGE_TITLE}}">
<meta property="og:url" content="{{CANONICAL}}">
<link rel="icon" href="/assets/icons/{{ID}}.png" type="image/png">
<link rel="stylesheet" href="/assets/app-base.css">
<link rel="stylesheet" href="/assets/themes/{{ID}}.css">
</head>
<body class="app-{{ID}} doc-{{DOC}}">

<header class="apphead">
  <div class="inner">
    <a class="brand" href="/{{ID}}/">
      <img class="brand-icon" src="/assets/icons/{{ID}}.png" alt="" width="48" height="48">
      <span class="brand-name">{{NAME}}</span>
    </a>
    <nav class="tabs" aria-label="{{NAME}}">{{NAV}}</nav>
  </div>
</header>

<main class="page">
  <h1><span class="mark">{{H1}}</span></h1>
{{STATUS}}
  <div class="body">
{{CONTENT}}
  </div>
</main>

<footer class="appfoot">
  <div class="inner">
    <span>{{NAME}} is made by <a href="/">Zilloris</a></span>
    <a href="mailto:support@zilloris.com">support@zilloris.com</a>
  </div>
</footer>

</body>
</html>
